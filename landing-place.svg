  <g transform="translate(120 -20)" stroke="#526b66" stroke-width="1.5" stroke-linejoin="round"><path d="M329 348 l34 0 -6 9 h-21z" fill="#eadfbd"/><path d="M336 348 l10 -10 10 10z" fill="#f8edce"/><path d="M346 338 v10" fill="none"/></g>
  <g stroke="#d4e6bd" stroke-width="2" fill="none"><path d="M136 357 q-3 -20 -11 -25 M144 358 q5 -23 14 -29 M330 358 q-2 -20 -9 -26 M338 358 q6 -19 14 -25"/></g>
  <g fill="#f6e5ac"><circle cx="125" cy="330" r="4"/><circle cx="158" cy="327" r="4"/><circle cx="321" cy="330" r="4"/><circle cx="352" cy="331" r="4"/></g>
  <text x="320" y="394" text-anchor="middle" fill="#e5efdc" font-family="sans-serif" font-size="18">A soft place to arrive.</text>
</svg>
