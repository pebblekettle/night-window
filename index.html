<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Night Window</title>
<style>
:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#18283a;color:#fff2d7;font:1.1rem/1.6 system-ui,sans-serif}main{width:min(90vw,38rem);text-align:center;padding:2rem 0}h1{font-family:Georgia,serif;font-weight:normal}.window{position:relative;overflow:hidden;height:17rem;border:1rem solid #796050;border-radius:11rem 11rem .5rem .5rem;background:linear-gradient(#1b3154,#5a5578);box-shadow:0 1rem 3rem #101a2b}.moon{position:absolute;top:2.5rem;right:5rem;width:3.5rem;height:3.5rem;border-radius:50%;background:#ffedb7;box-shadow:0 0 2rem #ffe6a288}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff9db 1px,transparent 2px);background-size:47px 39px;opacity:.8}.hill{position:absolute;bottom:-6rem;left:-10%;width:120%;height:12rem;border-radius:50%;background:#344e51}.light{position:absolute;bottom:1.5rem;left:46%;width:2rem;height:2.4rem;background:#f9d083;box-shadow:0 0 2rem #ffcf7488;border:6px solid #594638}.sky-pebble{position:absolute;top:3rem;left:22%;width:1rem;height:.7rem;border-radius:50%;background:#e5d4ad;box-shadow:-1.4rem -.6rem 0 -.25rem #fff2c5;transform:rotate(-25deg)}button{font:inherit;color:#172b32;background:#a9dfc7;border:0;border-radius:2rem;padding:.65rem 1.2rem;margin:.25rem;cursor:pointer}a{color:#fff2d7}button:focus-visible{outline:3px solid #fff;outline-offset:4px}#story{min-height:4em;max-width:32rem;margin:1.5rem auto}
</style><main><h1>The Night Window</h1><p>Look out for a little evening thought.</p><div class="window" aria-hidden="true"><div class="stars"></div><div class="moon"></div><div class="sky-pebble" hidden></div><div class="hill"></div><div class="light"></div></div><p id="story" aria-live="polite">One warm window stays awake beneath the sky.</p><button id="next" type="button">Another thought</button> <button id="sky-toggle" type="button" aria-pressed="false">Show sky pebble</button><p id="sky-story" hidden>A tiny traveller crosses the sky. Perhaps it will find a quiet place to land. <a href="landing-place.svg">See its imagined landing place</a> or <a href="landing-story.html">read a short story about its arrival</a>.</p></main>
<script src="night-window.js"></script></html>
